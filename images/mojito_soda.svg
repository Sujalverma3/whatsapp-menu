<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mojitoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="mojitoLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="mojitoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#mojitoBg)"/>
  <circle cx="200" cy="200" r="140" fill="#10B981" opacity="0.2" filter="blur(25px)"/>

  <!-- Glass Container -->
  <g transform="translate(110, 45)" filter="url(#mojitoShadow)">
    <!-- Glass Shape -->
    <path d="M30 80 L48 280 Q52 300 80 300 L100 300 Q128 300 132 280 L150 80 Z" fill="url(#mojitoLiquid)" opacity="0.9" />

    <!-- Ice Cubes inside -->
    <rect x="55" y="140" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.6" stroke="#A7F3D0" stroke-width="2" transform="rotate(15 70 155)"/>
    <rect x="90" y="190" width="32" height="32" rx="6" fill="#FFFFFF" opacity="0.55" stroke="#A7F3D0" stroke-width="2" transform="rotate(-20 106 206)"/>
    <rect x="60" y="225" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.5" stroke="#A7F3D0" stroke-width="2" transform="rotate(10 74 239)"/>

    <!-- Mint Leaves inside -->
    <path d="M50 180 Q65 160 80 180 Q65 200 50 180 Z" fill="#047857"/>
    <path d="M100 120 Q120 105 135 125 Q115 140 100 120 Z" fill="#047857"/>
    <path d="M85 240 Q105 230 115 250 Q95 260 85 240 Z" fill="#065F46"/>

    <!-- Fizz Bubbles -->
    <circle cx="70" cy="115" r="4" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="110" cy="155" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="85" cy="195" r="5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="65" cy="250" r="3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="115" cy="265" r="4" fill="#FFFFFF" opacity="0.7"/>

    <!-- Rim & Glass Reflection -->
    <ellipse cx="90" cy="80" rx="60" ry="12" fill="#E2E8F0" opacity="0.6" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M36 85 L52 278" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Lemon Wheel on Rim -->
    <g transform="translate(135, 70)">
      <circle cx="0" cy="0" r="30" fill="#FACC15" stroke="#EAB308" stroke-width="4"/>
      <circle cx="0" cy="0" r="23" fill="#FEF08A"/>
      <!-- Wheel Segments -->
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#CA8A04" stroke-width="2"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#CA8A04" stroke-width="2"/>
      <line x1="-16" y1="-16" x2="16" y2="16" stroke="#CA8A04" stroke-width="2"/>
      <line x1="-16" y1="16" x2="16" y2="-16" stroke="#CA8A04" stroke-width="2"/>
    </g>

    <!-- Green Straw -->
    <line x1="80" y1="90" x2="60" y2="-15" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="90" x2="60" y2="-15" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="8,8" stroke-linecap="round"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 345)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="100" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#065F46" text-anchor="middle" letter-spacing="0.5">
      🌿 REFRESHING MOJITO
    </text>
  </g>
</svg>