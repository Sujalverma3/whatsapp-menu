<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="breadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="cheeseMelt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="breadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#breadBg)"/>
  <circle cx="200" cy="200" r="140" fill="#F59E0B" opacity="0.16" filter="blur(25px)"/>

  <!-- Platter Plate -->
  <ellipse cx="200" cy="225" rx="165" ry="85" fill="#312E81" stroke="#4338CA" stroke-width="3" filter="url(#breadShadow)"/>
  <ellipse cx="200" cy="223" rx="145" ry="72" fill="#1E1B4B" />

  <!-- Garlic Bread Slices -->
  <!-- Back Slice -->
  <g transform="translate(130, 110) rotate(-15)">
    <path d="M0 40 Q70 10 140 40 Q150 70 130 90 Q60 120 0 90 Z" fill="url(#crustGrad)" stroke="#78350F" stroke-width="2"/>
    <path d="M10 45 Q70 20 130 45 Q120 75 10 75 Z" fill="url(#cheeseMelt)"/>
    <!-- Herbs -->
    <circle cx="45" cy="55" r="2.5" fill="#15803D"/>
    <circle cx="75" cy="45" r="3" fill="#15803D"/>
    <circle cx="100" cy="55" r="2" fill="#DC2626"/>
  </g>

  <!-- Front Main Cheese Stuffed Garlic Bread Sticks -->
  <g transform="translate(100, 155) rotate(5)">
    <!-- Main Loaf Body -->
    <path d="M10 50 Q105 10 200 50 Q215 95 190 120 Q95 155 10 115 Z" fill="url(#crustGrad)" stroke="#78350F" stroke-width="3" filter="url(#breadShadow)"/>

    <!-- Melted Mozzarella Layer -->
    <path d="M22 55 Q105 22 188 55 Q180 105 25 105 Z" fill="url(#cheeseMelt)"/>

    <!-- Cut Slices / Diagonal Grooves with Oozing Cheese -->
    <path d="M60 40 Q70 75 55 110" stroke="#B45309" stroke-width="3.5" fill="none"/>
    <path d="M56 60 Q80 80 52 95" stroke="#FFFFFF" stroke-width="4.5" fill="none" opacity="0.9"/> <!-- Cheese Pull -->

    <path d="M105 32 Q115 75 100 120" stroke="#B45309" stroke-width="3.5" fill="none"/>
    <path d="M100 55 Q125 78 98 100" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.95"/> <!-- Cheese Pull -->

    <path d="M150 38 Q160 75 145 115" stroke="#B45309" stroke-width="3.5" fill="none"/>
    <path d="M146 55 Q165 75 142 95" stroke="#FFFFFF" stroke-width="4.5" fill="none" opacity="0.9"/> <!-- Cheese Pull -->

    <!-- Oregano & Chilli Flakes Sprinkled -->
    <circle cx="40" cy="70" r="2" fill="#166534"/>
    <circle cx="50" cy="85" r="2.5" fill="#DC2626"/>
    <circle cx="80" cy="55" r="2.5" fill="#166534"/>
    <circle cx="90" cy="75" r="3" fill="#DC2626"/>
    <circle cx="125" cy="50" r="2" fill="#166534"/>
    <circle cx="135" cy="80" r="2.5" fill="#DC2626"/>
    <circle cx="165" cy="65" r="2.5" fill="#166534"/>
    <circle cx="175" cy="85" r="2" fill="#DC2626"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(90, 345)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="110" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#92400E" text-anchor="middle" letter-spacing="0.5">
      🥖 CHEESY GARLIC BREAD
    </text>
  </g>
</svg>