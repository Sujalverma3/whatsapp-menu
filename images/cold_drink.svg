<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="45%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="canRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glowDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="60" cy="60" r="54" fill="#FEE2E2" opacity="0.6"/>

  <!-- Ice Cubes behind -->
  <rect x="76" y="65" width="18" height="18" rx="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" transform="rotate(22 76 65)" opacity="0.85"/>
  <rect x="24" y="70" width="16" height="16" rx="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" transform="rotate(-15 24 70)" opacity="0.8"/>

  <!-- Chilled Soda Can (Center-Left) -->
  <g filter="url(#glowDrop)">
    <!-- Can Rim Top -->
    <ellipse cx="48" cy="36" rx="19" ry="6" fill="url(#canRim)"/>
    <ellipse cx="48" cy="35" rx="16" ry="4.5" fill="#E2E8F0"/>
    <path d="M 45 34 Q 48 32 52 35" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Can Body -->
    <path d="M 29 36 L 29 88 C 29 94 67 94 67 88 L 67 36 Z" fill="url(#canGrad)"/>
    <!-- Can Base -->
    <ellipse cx="48" cy="88" rx="19" ry="5.5" fill="url(#canRim)"/>
    
    <!-- White Wave Branding on Can -->
    <path d="M 29 55 Q 40 45 48 60 T 67 52 L 67 66 Q 56 58 48 72 T 29 68 Z" fill="#FFFFFF" opacity="0.9"/>
    <text x="48" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#BE123C" text-anchor="middle" letter-spacing="0.5">COLD</text>

    <!-- Condensation Frost Droplets -->
    <circle cx="34" cy="46" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="36" cy="74" r="1.8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="62" cy="50" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="60" cy="78" r="1.6" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="44" cy="82" r="1.4" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- Chilled Glass Bottle with Straw (Right) -->
  <g filter="url(#glowDrop)">
    <!-- Red & White Striped Straw -->
    <path d="M 78 20 L 78 45" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 78 22 L 78 26" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M 78 32 L 78 36" stroke="#FFFFFF" stroke-width="4.5"/>

    <!-- Bottle Crown Cap -->
    <rect x="73" y="30" width="10" height="5" rx="1.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>

    <!-- Bottle Neck -->
    <path d="M 74 35 L 74 48 Q 74 54 84 58 L 84 94 Q 84 99 78 99 Q 72 99 72 94 L 72 58 Q 82 54 82 48 L 82 35 Z" fill="url(#bottleGrad)" opacity="0.92"/>

    <!-- Bottle Label -->
    <rect x="71" y="66" width="16" height="15" rx="2" fill="#E11D48"/>
    <circle cx="79" cy="73.5" r="5" fill="#FFFFFF"/>
    <text x="79" y="75.5" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#E11D48" text-anchor="middle">FIZZ</text>
  </g>

  <!-- Sparkles & Bubbles -->
  <circle cx="28" cy="28" r="3" fill="url(#bubbleGrad)"/>
  <circle cx="92" cy="40" r="2.5" fill="url(#bubbleGrad)"/>
  <circle cx="66" cy="22" r="2" fill="url(#bubbleGrad)"/>
  <circle cx="96" cy="78" r="2.2" fill="url(#bubbleGrad)"/>

  <!-- Chilled Badge -->
  <g transform="translate(62, 92)">
    <rect x="0" y="0" width="46" height="18" rx="9" fill="#0284C7"/>
    <text x="23" y="12.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">❄️ CHILLED</text>
  </g>
</svg>