<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="burgerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C16" />
      <stop offset="100%" stop-color="#120E0B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97736" />
    </linearGradient>
  </defs>

  <rect width="500" height="320" rx="16" fill="url(#burgerGrad)" stroke="#3D2B1F" stroke-width="2"/>

  <!-- Top Meme Badge -->
  <rect x="25" y="18" width="450" height="36" rx="18" fill="url(#goldGrad)" />
  <text x="250" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    👑 AADHA BURGER KYA HOTA HAI BINOD? POORA KHAO! 🍔
  </text>

  <!-- Big Burger Graphic -->
  <g transform="translate(60, 75)">
    <!-- Top Bun -->
    <path d="M20 70 Q70 10 120 70 Z" fill="#D97706" />
    <!-- Sesame Seeds -->
    <ellipse cx="50" cy="40" rx="2" ry="4" fill="#FEF3C7" transform="rotate(20 50 40)"/>
    <ellipse cx="70" cy="30" rx="2" ry="4" fill="#FEF3C7" transform="rotate(-15 70 30)"/>
    <ellipse cx="90" cy="45" rx="2" ry="4" fill="#FEF3C7" transform="rotate(30 90 45)"/>
    <ellipse cx="65" cy="50" rx="2" ry="4" fill="#FEF3C7" transform="rotate(-5 65 50)"/>
    <!-- Lettuce -->
    <path d="M15 70 Q40 85 70 70 Q100 85 125 70 L125 78 Q100 90 70 78 Q40 90 15 78 Z" fill="#16A34A" />
    <!-- Tomato Slice -->
    <rect x="20" y="80" width="100" height="10" rx="4" fill="#DC2626" />
    <!-- Melted Cheese Layer -->
    <polygon points="18,90 122,90 115,104 100,95 85,108 70,95 55,106 35,95 25,105" fill="#FACC15" />
    <!-- Crispy Veg Patty 1 -->
    <rect x="18" y="100" width="104" height="18" rx="6" fill="#78350F" />
    <!-- Second Cheese & Patty Layer -->
    <polygon points="20,118 120,118 110,128 85,122 65,130 40,122 25,128" fill="#FACC15" />
    <rect x="18" y="126" width="104" height="18" rx="6" fill="#78350F" />
    <!-- Bottom Bun -->
    <path d="M20 144 L120 144 Q120 170 70 170 Q20 170 20 144 Z" fill="#B45309" />
  </g>

  <!-- Meme Quote Box -->
  <g transform="translate(210, 80)">
    <rect x="0" y="0" width="265" height="155" rx="14" fill="#2A1E17" stroke="#4A3428" stroke-width="1.5" />
    <text x="20" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14.5" fill="#FCD34D">
      "Binod bola:
    </text>
    <text x="20" y="56" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">
      'Burger me aadha kya?'"
    </text>
    <text x="20" y="88" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="12.5" fill="#D1D5DB">
      Dosti me hissa chalega,
    </text>
    <text x="20" y="108" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="12.5" fill="#D1D5DB">
      par burger pura hi khaya jayega! 🤤
    </text>
    <rect x="20" y="122" width="170" height="22" rx="11" fill="#D97736" />
    <text x="105" y="137" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">
      ✓ 100% Full Sized Burger
    </text>
  </g>

  <!-- Bottom Strip -->
  <text x="250" y="280" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#9CA3AF" text-anchor="middle">
    TrueCafe Rules: Aadha burger mangna sakht mana hai 😂
  </text>
</svg>